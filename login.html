<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Đăng nhập - Lịch học thông minh">
  <meta name="theme-color" content="#4f46e5">
  <title>Đăng nhập - Lịch Học</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --color-primary: #6366f1;
      --color-primary-dark: #4f46e5;
      --color-gray-50: #f9fafb;
      --color-gray-100: #f3f4f6;
      --color-gray-200: #e5e7eb;
      --color-gray-600: #4b5563;
      --color-gray-800: #1f2937;
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      --radius-lg: 12px;
      --radius-full: 9999px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-logo {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .login-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--color-gray-800);
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--color-gray-600);
      margin-bottom: 32px;
    }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 24px;
      background: white;
      border: 2px solid var(--color-gray-200);
      border-radius: var(--radius-full);
      font-size: 16px;
      font-weight: 600;
      color: var(--color-gray-800);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-google:hover {
      border-color: var(--color-primary);
      background: var(--color-gray-50);
    }

    .btn-google:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-google svg {
      width: 20px;
      height: 20px;
    }

    .login-features {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--color-gray-200);
    }

    .login-features h4 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-gray-600);
      margin-bottom: 16px;
    }

    .feature-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: var(--color-gray-600);
    }

    .feature-item span {
      font-size: 18px;
    }

    .login-error {
      background: #fef2f2;
      color: #dc2626;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      display: none;
    }

    .login-error.show {
      display: block;
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--color-gray-200);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-logo">📅</div>
    <h1 class="login-title">Lịch Học Thông Minh</h1>
    <p class="login-subtitle">Quản lý lịch học cho cả gia đình</p>

    <div class="login-error" id="login-error"></div>

    <button class="btn-google" id="btn-google-login">
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Đăng nhập với Google
    </button>

    <div class="login-features">
      <h4>Tính năng</h4>
      <div class="feature-list">
        <div class="feature-item">
          <span>📚</span>
          <div>Quản lý lịch học hè & năm học</div>
        </div>
        <div class="feature-item">
          <span>👨‍👩‍👧‍👦</span>
          <div>Nhiều người dùng (mỗi con 1 lịch)</div>
        </div>
        <div class="feature-item">
          <span>🤖</span>
          <div>AI gợi ý lịch học cân bằng</div>
        </div>
        <div class="feature-item">
          <span>🔔</span>
          <div>Nhắc nhở qua email mỗi ngày</div>
        </div>
        <div class="feature-item">
          <span>📊</span>
          <div>Báo cáo tiến độ chi tiết</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initAuth, signInWithGoogle, getCurrentUser } from './js/auth.js';

    const btnLogin = document.getElementById('btn-google-login');
    const errorEl = document.getElementById('login-error');

    // Check if already logged in
    initAuth((user, profile) => {
      if (user) {
        // Redirect to main app
        window.location.href = 'index.html';
      }
    });

    btnLogin.addEventListener('click', async () => {
      btnLogin.disabled = true;
      btnLogin.innerHTML = '<span class="loading-spinner"></span> Đang đăng nhập...';
      errorEl.classList.remove('show');

      const result = await signInWithGoogle();

      if (result.success) {
        // Auth state change will handle redirect
      } else {
        errorEl.textContent = result.error || 'Đăng nhập thất bại. Vui lòng thử lại.';
        errorEl.classList.add('show');
        btnLogin.disabled = false;
        btnLogin.innerHTML = `
          <svg viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Đăng nhập với Google
        `;
      }
    });
  </script>
</body>
</html>
